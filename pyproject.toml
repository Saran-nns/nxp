[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexes"
version = "1.0.0"
description = "Nexus Exchange Protocol (NXP): a zero-trust protocol and framework for agent-to-agent communication (not an implementation of Google's A2A Protocol)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Saranraj Nambusubramaniyan", email = "13406046+Saran-nns@users.noreply.github.com" }]
keywords = [
  "nxp",
  "mcp",
  "a2a",
  "grpc",
  "agents",
  "llm",
  "multi-agent",
  "internet-of-agents",
  "agent-protocol",
  "zero-trust",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: Free To Use But Restricted",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Framework :: FastAPI",
]
dependencies = [
  # HTTP server & async HTTP client
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  # Data validation
  "pydantic>=2.7.0",
  # Async compatibility
  "anyio>=4.4.0",
  # CLI & Rich output
  "typer>=0.12.0",
  "rich>=13.7.0",
  # NXP WebSocket Protocol
  "websockets>=12.0",
  # BFP wire codec (msgpack body encoding)
  "msgpack>=1.0.0",
  # Zero-trust identity & SDMT (Ed25519, X25519, HKDF)
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
grpc = [
  "grpcio>=1.64.0",
  "grpcio-tools>=1.64.0",
  "protobuf>=5.0.0",
]
mcp = [
  "fastmcp>=2.0.0",
  "mcp>=1.0.0",
]
auth = [
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
]
memory = [
  "chromadb>=0.5.0",
  "sentence-transformers>=3.0.0",
]
openai = ["openai>=1.30.0"]
langchain = ["langchain-core>=0.2.0"]
all = [
  "nxp[grpc,mcp,auth,memory,openai]",
]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "mypy>=1.10.0",
  "ruff>=0.4.0",
  "hatch",
  "build",
]

[project.scripts]
nxp = "nxp.cli:app"

[project.urls]
Homepage = "https://github.com/Saran-nns/nxp"
Documentation = "https://github.com/Saran-nns/nxp#readme"
Repository = "https://github.com/Saran-nns/nxp"
"Bug Tracker" = "https://github.com/Saran-nns/nxp/issues"

[tool.hatch.build.targets.wheel]
packages = ["nxp"]

[tool.hatch.build.targets.sdist]
# Explicit scope so the sdist only ships what's needed to build and test the
# package, rather than hatchling's VCS-based default (which would also pick up
# things like .pytest_cache or any stray local files git hasn't ignored).
include = [
  "/nxp",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/requirements.txt",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
